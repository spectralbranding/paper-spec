# paper.yaml -- Paper Spec v0.2.0
# Zharnikov (2026x): R16 -- AI-Native Brand Identity
spec_version: "0.2.0"

meta:
  title: "AI-Native Brand Identity: From Visual Recognition to Cryptographic Verification"
  authors:
    - name: "Zharnikov, Dmitry"
      orcid: "0009-0000-6893-9231"
      affiliation: "Independent Researcher"
  doi: "10.5281/zenodo.19391476"
  date: "2026-04-02"
  version: "1.0"
  venue: "Zenodo preprint (target: JIM)"
  license: "CC-BY-NC-ND-4.0"
  keywords:
    - brand identity
    - AI agents
    - cryptographic verification
    - behavioral specification
    - metamerism
    - agentic commerce
    - generative engine optimization
    - brand function
    - observer-driven evolution
    - dual identity infrastructure
    - observational equivalence
    - behavioral metamerism index

claims:
  - id: "P1"
    type: proposition
    statement: >
      Identity verification technologies emerge discontinuously in response to changes
      in the dominant observer type. Each transition produces a technology optimized for
      the new observer's verification capabilities.
    testable: true
    tested_in_paper: false
    status: not_tested
    depends_on: []

  - id: "P2"
    type: proposition
    statement: >
      The current transition from human to AI observers constitutes the sixth observer
      transition in the historical pattern, predicting a shift from visual-emotional
      identity technologies (logos) to machine-verifiable behavioral specifications
      (cryptographic signatures on Brand Functions).
    testable: true
    tested_in_paper: false
    status: not_tested
    depends_on: ["P1"]

  - id: "P3"
    type: proposition
    statement: >
      AI agents form brand representations through statistical co-occurrence rather
      than perceptual processing, creating systematic biases (frequency bias, market
      dominance bias, recency bias) that are structurally different from human
      perceptual biases and cannot be addressed by human-oriented brand identity tools.
    testable: true
    tested_in_paper: false
    status: not_tested
    depends_on: []

  - id: "P4"
    type: proposition
    statement: >
      A Brand Function -- f(query, context, observer_type, time) -> response --
      provides a complete behavioral specification that enables coherence verification,
      perception measurement, and cross-touchpoint consistency in ways that existing
      machine-readable brand protocols (brand.json, Brando Schema) cannot.
    testable: true
    tested_in_paper: false
    status: not_tested
    depends_on: ["P3"]

  - id: "P5"
    type: proposition
    statement: >
      In autonomous commerce where AI agents transact without human oversight,
      cryptographic attestation of behavioral claims becomes the primary trust
      mechanism, replacing reputation-based trust that requires accumulated human
      experience.
    testable: true
    tested_in_paper: false
    status: not_tested
    depends_on: ["P2", "P4"]

  - id: "P6"
    type: proposition
    statement: >
      Behavioral metamerism -- where brands with identical statistical profiles
      exhibit structurally different behavioral signatures -- represents a form of
      brand confusion that statistical optimization (including GEO) cannot detect
      or resolve, requiring behavioral specification for disambiguation.
    testable: true
    tested_in_paper: false
    status: not_tested
    depends_on: ["P4"]

acceptance:
  - claim_id: "P1"
    falsification: >
      Falsified if the AI-observer transition produces only incremental extensions of
      logo-based identity rather than a structurally different verification mechanism.

  - claim_id: "P2"
    falsification: >
      Falsified if AI agents demonstrably use logos as informational inputs that
      significantly affect recommendation quality.

  - claim_id: "P3"
    falsification: >
      Falsified if multimodal AI agents processing visual brand elements make measurably
      better purchasing decisions than text-only agents with identical structured data.

  - claim_id: "P4"
    falsification: >
      Falsified if existing protocols prove sufficient for AI agents to measure brand
      coherence and predict behavioral responses without additional specification layers.

  - claim_id: "P5"
    falsification: >
      Falsified if AI-mediated commerce scales to >20% of category transactions without
      adopting cryptographic brand verification.

  - claim_id: "P6"  # pilot script: behavioral_metamerism_pilot.py
    falsification: >
      Falsified if augmented-condition LLM discrimination accuracy does not exceed
      statistical-only accuracy by a significant margin (p < 0.05) across >=3 categories.

dependencies:
  - doi: "10.5281/zenodo.18945912"
    claim: "Companion paper 2026a, Spectral Brand Theory: theoretical foundation"
    relationship: cites_as_related
  - doi: "10.5281/zenodo.18945352"
    claim: "Companion paper 2026e, Spectral Metamerism in Brand Perception: metamerism formalization"
    relationship: cites_as_related
  - doi: "10.5281/zenodo.19064427"
    claim: "Companion paper 2026l, The Rendering Problem: specification gap"
    relationship: cites_as_related
  - reference: "Zharnikov (2026q). Spectral Portfolio Theory."
    claim: "Companion paper 2026q, Spectral Portfolio Theory: multi brand dynamics"
    relationship: cites_as_related
