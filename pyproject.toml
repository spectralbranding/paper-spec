[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-spec"
version = "0.2.0"
description = "Machine-readable specification format for scientific papers"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    {name = "Dmitry Zharnikov", email = "dmitry@spectralbranding.com"},
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8",
    "jsonschema>=4.20",
    "mypy",
    "pytest>=8",
]

[tool.black]
target-version = ["py314"]
line-length = 88

[tool.flake8]
max-line-length = 88
exclude = [".venv", "__pycache__"]

[tool.mypy]
python_version = "3.14"
